<template>
  <lightning-card title={labels.title} icon-name="standard:timeslot">
    <div class="slds-var-p-horizontal_medium">
      <template if:true={loading}>
        <lightning-spinner alternative-text={labels.title} size="small"></lightning-spinner>
      </template>

      <template if:true={errorMessage}>
        <p class="slds-text-color_error" data-id="error">{errorMessage}</p>
      </template>

      <template if:true={noticeMessage}>
        <p class="slds-text-color_success" data-id="notice">{noticeMessage}</p>
      </template>

      <template if:true={isEmpty}>
        <p data-id="empty">{labels.empty}</p>
        <lightning-button
          label={labels.generateNow}
          variant="brand"
          data-id="generate"
          class="slds-var-m-top_small"
          onclick={handleGenerate}
        ></lightning-button>
      </template>

      <template if:true={hasInstallments}>
        <table class="slds-table slds-table_cell-buffer slds-table_bordered" data-id="schedule">
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col">{labels.sequence}</th>
              <th scope="col">{labels.dueDate}</th>
              <th scope="col">{labels.amount}</th>
              <th scope="col">{labels.paid}</th>
              <th scope="col">{labels.status}</th>
            </tr>
          </thead>
          <tbody>
            <template for:each={installments} for:item="installment">
              <tr key={installment.key} class="slds-hint-parent">
                <td>{installment.sequence}</td>
                <td>
                  <lightning-formatted-date-time
                    value={installment.dueDate}
                  ></lightning-formatted-date-time>
                </td>
                <td>
                  <lightning-formatted-number
                    format-style="currency"
                    value={installment.expectedAmount}
                  ></lightning-formatted-number>
                </td>
                <td>
                  <lightning-formatted-number
                    format-style="currency"
                    value={installment.paidAmount}
                  ></lightning-formatted-number>
                </td>
                <td>
                  <lightning-badge
                    label={installment.status}
                    class={installment.badgeClass}
                  ></lightning-badge>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </template>
    </div>
  </lightning-card>
</template>
