<template>
  <lightning-card title={labels.title} icon-name="custom:custom25">
    <div class="slds-var-p-horizontal_medium">
      <template if:true={hasError}>
        <p data-id="error-message" class="slds-text-color_error slds-var-m-bottom_small">
          {errorMessage}
        </p>
      </template>

      <template if:true={isEmpty}>
        <p data-id="empty-state" class="slds-text-body_regular">{labels.none}</p>
      </template>

      <template if:true={hasTribute}>
        <p data-id="summary" class="slds-text-body_regular">{summary}</p>
        <p data-id="status" class="slds-text-body_small slds-var-m-top_xx-small">
          {statusText}
          <template if:true={tribute.notificationSentDate}>
            <lightning-formatted-date-time
              value={tribute.notificationSentDate}
            ></lightning-formatted-date-time>
          </template>
        </p>
        <template if:true={tribute.message}>
          <p data-id="message" class="slds-text-body_small slds-var-m-top_x-small">
            {tribute.message}
          </p>
        </template>
        <template if:true={showBlockedReason}>
          <p data-id="blocked-reason" class="slds-text-body_small slds-var-m-top_x-small">
            {blockedReason}
          </p>
        </template>
        <template if:true={showMarkSent}>
          <lightning-button
            data-id="mark-sent"
            class="slds-var-m-top_small"
            variant="brand"
            label={labels.markSent}
            disabled={markSentDisabled}
            onclick={handleMarkSent}
          ></lightning-button>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
