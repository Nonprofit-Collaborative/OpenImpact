<template>
    <div class="slds-var-p-around_medium">
        <h2 class="slds-text-heading_small" data-id="title">{labels.title}</h2>
        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="intro">
            {labels.intro}
        </p>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-bottom_small" data-id="error" role="alert">
                {errorMessage}
            </p>
        </template>

        <template lwc:if={noticeMessage}>
            <p class="slds-var-m-bottom_small" data-id="notice" role="status" aria-live="polite">
                {noticeMessage}
            </p>
        </template>

        <div class="slds-box slds-box_x-small slds-var-m-bottom_small">
            <p data-id="schedule-message">{scheduleMessage}</p>

            <template lwc:if={hasNextRun}>
                <p class="slds-text-body_small" data-id="next-run">
                    {labels.nextRunHeading}:
                    <lightning-formatted-date-time
                        value={nextRunAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </p>
            </template>

            <div class="slds-var-m-top_x-small">
                <lightning-button
                    data-id="schedule-button"
                    label={scheduleButtonLabel}
                    disabled={controlsDisabled}
                    onclick={handleSchedule}
                ></lightning-button>
                <lightning-button
                    class="slds-var-m-left_x-small"
                    data-id="run-now"
                    label={labels.runNow}
                    disabled={controlsDisabled}
                    onclick={handleRunNow}
                ></lightning-button>
            </div>

            <template lwc:if={showReadOnlyNote}>
                <p class="slds-text-body_small slds-var-m-top_x-small" data-id="read-only">
                    {labels.readOnly}
                </p>
            </template>
        </div>

        <ul class="slds-has-dividers_bottom-space" data-id="jobs">
            <template for:each={jobs} for:item="job">
                <li class="slds-item" key={job.key} data-id="job">
                    <p>
                        <strong data-id="job-name">{job.name}</strong>
                    </p>
                    <p class="slds-text-body_small" data-id="job-description">
                        {job.description}
                    </p>
                    <p>
                        {labels.lastRunHeading}:
                        <template lwc:if={job.hasLastRun}>
                            <lightning-formatted-date-time
                                data-id="job-last-run"
                                value={job.lastRun}
                                year="numeric"
                                month="short"
                                day="2-digit"
                                hour="2-digit"
                                minute="2-digit"
                            ></lightning-formatted-date-time>
                        </template>
                        <template lwc:else>
                            <span data-id="job-never-run">{labels.neverRun}</span>
                        </template>
                    </p>
                    <template lwc:if={job.hasSummary}>
                        <p class="slds-text-body_small" data-id="job-summary">
                            {job.lastRunSummary}
                        </p>
                    </template>
                    <template lwc:if={job.stale}>
                        <p class="slds-text-color_error" data-id="job-stale" role="status">
                            {labels.stale}
                        </p>
                    </template>
                </li>
            </template>
        </ul>
    </div>
</template>
