<template>
    <div class="slds-var-p-around_medium">
        <h2 class="slds-text-heading_small" data-id="title">{labels.title}</h2>
        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-bottom_small" data-id="error" role="alert">
                {errorMessage}
            </p>
        </template>

        <template lwc:if={noticeMessage}>
            <p class="slds-var-m-bottom_small" data-id="notice" role="status" aria-live="polite">
                {noticeMessage}
            </p>
        </template>

        <template lwc:if={loaded}>
            <div class="slds-box slds-box_x-small">
                <p data-id="current">
                    {labels.closedThroughHeading}:
                    <template lwc:if={isClosed}>
                        <lightning-formatted-date-time
                            value={closedThrough}
                            year="numeric"
                            month="long"
                            day="numeric"
                            time-zone="UTC"
                        ></lightning-formatted-date-time>
                    </template>
                    <template lwc:else>{labels.notClosed}</template>
                </p>

                <template lwc:if={canManage}>
                    <div class="slds-var-m-top_small">
                        <lightning-input
                            data-id="close-date"
                            type="date"
                            label={labels.closedThroughHeading}
                            value={draftDate}
                            max={latestAllowed}
                            onchange={handleDateChange}
                        ></lightning-input>
                        <lightning-button
                            class="slds-var-m-top_x-small"
                            data-id="save"
                            variant="brand"
                            label={labels.save}
                            disabled={saveDisabled}
                            onclick={handleSave}
                        ></lightning-button>
                        <p class="slds-text-body_small slds-var-m-top_x-small" data-id="reopen-note">
                            {labels.reopenNote}
                        </p>
                    </div>
                </template>

                <template lwc:if={showReadOnlyNote}>
                    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="read-only">
                        {labels.readOnly}
                    </p>
                </template>
            </div>
        </template>
    </div>
</template>
