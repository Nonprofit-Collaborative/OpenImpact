<template>
  <div class="slds-p-around_medium">
    <h2 class="slds-text-heading_small slds-m-bottom_small">{labels.heading}</h2>

    <template if:true={loadError}>
      <p class="slds-text-color_error slds-m-bottom_small" data-id="load-error">{loadError}</p>
    </template>

    <lightning-radio-group
      data-id="mode"
      name="mode"
      label={labels.heading}
      variant="label-hidden"
      options={modeOptions}
      value={mode}
      onchange={handleModeChange}
    ></lightning-radio-group>

    <p class="slds-m-vertical_x-small" data-id="remaining">
      {labels.remaining}:
      <lightning-formatted-number
        value={remainingAmount}
        format-style="currency"
      ></lightning-formatted-number>
    </p>

    <template if:false={isWriteOff}>
      <lightning-input
        data-id="amount"
        type="number"
        formatter="currency"
        step="0.01"
        label={labels.amount}
        value={amount}
        onchange={handleAmountChange}
      ></lightning-input>
    </template>

    <lightning-input
      data-id="reason"
      type="text"
      max-length="255"
      label={labels.reason}
      value={reason}
      onchange={handleReasonChange}
    ></lightning-input>

    <div class="slds-m-top_medium slds-text-align_right">
      <lightning-button
        data-id="cancel"
        label={labels.cancel}
        onclick={handleCancel}
        class="slds-m-right_x-small"
      ></lightning-button>
      <lightning-button
        data-id="confirm"
        variant="brand"
        label={labels.confirm}
        disabled={confirmDisabled}
        onclick={handleConfirm}
      ></lightning-button>
    </div>
  </div>
</template>
