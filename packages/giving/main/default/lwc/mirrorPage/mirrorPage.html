<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={iconName}>
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template lwc:if={spinnerShown}>
                <lightning-spinner alternative-text={labels.loading} size="small" data-id="spinner"></lightning-spinner>
            </template>
            <p class="slds-var-m-bottom_medium" data-id="intro">{labels.intro}</p>
            <c-settings-setup-notes notes={setupNotes}></c-settings-setup-notes>
            <template lwc:if={view.unavailableShown}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="warning" message={labels.unavailable} data-id="unavailable"></c-barn-notice>
            </template>
            <template lwc:if={view.offShown}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={labels.switchedOff} data-id="off"></c-barn-notice>
            </template>
            <template lwc:if={view.onShown}>
                <template lwc:if={view.notReadyShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="error" message={status.notReadyReason} data-id="not-ready"></c-barn-notice>
                </template>
                <template lwc:else>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="info" message={directionText} data-id="direction"></c-barn-notice>
                </template>
                <p class="slds-var-m-bottom_small" data-id="schedule">{scheduleText}</p>
                <p class="slds-var-m-bottom_small" data-id="last-run">{lastRunText}</p>
                <template lwc:if={view.noManageShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="info" message={labels.noManagePermission} data-id="no-manage"></c-barn-notice>
                </template>
                <template lwc:if={view.noAccessShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="error" message={labels.noAccess} data-id="no-access"></c-barn-notice>
                </template>
                <div class="slds-var-m-vertical_medium">
                    <lightning-button
                        variant="brand"
                        label={labels.runNow}
                        onclick={handleRunNow}
                        disabled={view.runDisabled}
                        data-id="run-now"
                    ></lightning-button>
                    <template lwc:if={view.scheduled}>
                        <lightning-button
                            class="slds-var-m-left_small"
                            label={labels.stopSchedule}
                            onclick={handleStop}
                            disabled={view.manageDisabled}
                            data-id="stop"
                        ></lightning-button>
                    </template>
                    <template lwc:else>
                        <lightning-button
                            class="slds-var-m-left_small"
                            label={labels.scheduleNightly}
                            onclick={handleSchedule}
                            disabled={view.scheduleDisabled}
                            data-id="schedule-nightly"
                        ></lightning-button>
                    </template>
                </div>
                <template lwc:if={view.runningShown}>
                    <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={runningText} data-id="running"></c-barn-notice>
                </template>
            </template>
            <template lwc:if={error}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="error" message={error} data-id="error"></c-barn-notice>
            </template>
            <template lwc:if={view.available}>
                <h2 class="slds-text-heading_small slds-var-m-top_large slds-var-m-bottom_x-small">
                    {labels.reconciliationTitle}
                </h2>
                <p class="slds-var-m-bottom_small">{labels.reconciliationIntro}</p>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label={labels.fromDate}
                            value={fromDate}
                            onchange={handleFrom}
                            data-id="from"
                        ></lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label={labels.toDate}
                            value={toDate}
                            onchange={handleTo}
                            data-id="to"
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-var-m-top_small">
                        <lightning-button
                            label={labels.compare}
                            onclick={handleCompare}
                            disabled={working}
                            data-id="compare"
                        ></lightning-button>
                    </div>
                </div>
                <template lwc:if={comparison}>
                    <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_medium" data-id="sides">
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
                            <c-barn-stat-tile label={labels.columnGift} value={comparison.giftCount} bordered align="start" data-id="gift-count"></c-barn-stat-tile>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
                            <c-barn-stat-tile label={labels.columnGiftAmount} value={comparison.giftTotal} format-style="currency" currency-code={currencyCode} bordered align="start" data-id="gift-total"></c-barn-stat-tile>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
                            <c-barn-stat-tile label={labels.columnLinked} value={linkedCount} bordered align="start" data-id="linked-count"></c-barn-stat-tile>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-var-m-bottom_x-small">
                            <c-barn-stat-tile label={labels.columnLinkedAmount} value={linkedTotal} format-style="currency" currency-code={currencyCode} bordered align="start" data-id="linked-total"></c-barn-stat-tile>
                        </div>
                    </div>
                    <c-barn-notice
                        class="slds-var-m-vertical_small"
                        variant={differenceVariant}
                        message={differenceText}
                        data-id="difference-count"
                    ></c-barn-notice>
                    <template lwc:if={copyAgainShown}>
                        <lightning-button
                            class="slds-var-m-bottom_small"
                            label={labels.copyAgain}
                            onclick={handleCopyAgain}
                            disabled={view.runDisabled}
                            data-id="copy-again"
                        ></lightning-button>
                    </template>
                    <template lwc:if={hasDifferences}>
                        <div class="slds-scrollable_x">
                            <lightning-datatable
                                key-field="key"
                                data={rows}
                                columns={columns}
                                hide-checkbox-column
                                data-id="differences"
                            ></lightning-datatable>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
