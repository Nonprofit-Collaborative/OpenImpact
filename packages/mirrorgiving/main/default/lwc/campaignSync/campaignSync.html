<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={icons.campaignSync}>
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-var-m-bottom_medium" data-id="intro">{labels.intro}</p>
            <c-settings-setup-notes notes={setupNotes}></c-settings-setup-notes>
            <template lwc:if={unavailableShown}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="warning" message={labels.unavailable} data-id="unavailable"></c-barn-notice>
            </template>
            <template lwc:if={offShown}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={labels.switchedOff} data-id="off"></c-barn-notice>
            </template>
            <template lwc:if={onShown}>
                <c-barn-notice class="slds-var-m-bottom_small" variant="success" message={labels.switchedOn} data-id="on"></c-barn-notice>
                <template lwc:if={countsText}>
                    <c-barn-meter
                        class="slds-var-m-bottom_small"
                        label={countsText}
                        value={linkedCount}
                        max={appealCount}
                        data-id="counts"
                    ></c-barn-meter>
                </template>
                <template lwc:if={noAccessShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="error" message={labels.noCampaignAccess} data-id="no-access"></c-barn-notice>
                </template>
                <template lwc:if={noManageShown}>
                    <c-barn-notice class="slds-var-m-bottom_small" variant="info" message={labels.noManagePermission} data-id="no-manage"></c-barn-notice>
                </template>
                <div class="slds-var-m-vertical_medium">
                    <lightning-button
                        variant="brand"
                        label={labels.syncAll}
                        onclick={handleSyncAll}
                        disabled={syncDisabled}
                        data-id="sync-all"
                    ></lightning-button>
                </div>
                <template lwc:if={runningShown}>
                    <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={labels.running} data-id="running"></c-barn-notice>
                </template>
            </template>
            <template lwc:if={error}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="error" message={error} data-id="error"></c-barn-notice>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
