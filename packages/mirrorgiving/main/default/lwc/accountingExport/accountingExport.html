<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name={icons.accountingExport}>
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>
            <p class="slds-text-color_weak slds-var-m-bottom_medium" data-id="visibility">
                {labels.visibility}
            </p>
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="date"
                        label={labels.from}
                        value={fromDate}
                        required
                        onchange={handleFromChange}
                        data-id="from"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="date"
                        label={labels.to}
                        value={toDate}
                        required
                        onchange={handleToChange}
                        data-id="to"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-record-picker
                        label={labels.fund}
                        placeholder={labels.allFunds}
                        object-api-name={fundObjectApiName}
                        value={fundId}
                        onchange={handleFundChange}
                        data-id="fund"
                    ></lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label={labels.paymentMethod}
                        options={methodOptions}
                        value={paymentMethod}
                        onchange={handleMethodChange}
                        data-id="method"
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-var-m-top_x-small">
                    <lightning-input
                        type="checkbox"
                        label={labels.onlyUnposted}
                        checked={onlyUnposted}
                        onchange={handleOnlyUnpostedChange}
                        data-id="only-unposted"
                    ></lightning-input>
                </div>
            </div>
            <div class="slds-var-m-vertical_medium">
                <lightning-button
                    variant="brand"
                    label={labels.download}
                    onclick={handleDownload}
                    disabled={working}
                    data-id="download"
                ></lightning-button>
            </div>
            <template lwc:if={error}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="error" message={error} data-id="error"></c-barn-notice>
            </template>
            <template lwc:if={message}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="success" message={message} data-id="message"></c-barn-notice>
            </template>
            <template lwc:if={showMarkPosted}>
                <div class="slds-var-m-bottom_medium">
                    <p class="slds-var-m-bottom_x-small" data-id="mark-help">{labels.markPostedHelp}</p>
                    <lightning-button
                        label={labels.markPosted}
                        onclick={handleMarkPosted}
                        disabled={working}
                        data-id="mark-posted"
                    ></lightning-button>
                </div>
            </template>
            <template lwc:if={showNeedsAllFunds}>
                <c-barn-notice class="slds-var-m-bottom_medium" variant="info" message={labels.markNeedsAllFunds} data-id="needs-all-funds"></c-barn-notice>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
