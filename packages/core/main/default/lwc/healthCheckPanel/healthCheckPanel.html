<template>
    <template lwc:if={helpReady}>
    <lightning-card title={labels.title} icon-name="standard:approval">
        <div slot="actions">
            <lightning-button
                label={rerunLabel}
                onclick={handleRerun}
                class="slds-var-m-right_x-small"
                data-id="rerun"
            ></lightning-button>
            <template lwc:if={showRunRemaining}>
                <lightning-button
                    label={labels.runRemaining}
                    onclick={handleRunRemaining}
                    class="slds-var-m-right_x-small"
                    data-id="run-remaining"
                ></lightning-button>
            </template>
            <template if:true={showUseRecommended}>
                <lightning-button
                    variant="brand"
                    label={labels.useRecommended}
                    onclick={handleUseRecommended}
                    data-id="use-recommended"
                ></lightning-button>
            </template>
        </div>

        <div class="slds-var-p-horizontal_medium">
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">{labels.intro}</p>

            <template if:true={loading}>
                <p role="status" data-id="loading">{labels.loading}</p>
            </template>

            <template if:true={errorMessage}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="error"
                    message={errorMessage}
                    data-id="error"
                ></c-barn-notice>
            </template>

            <template if:true={showLastRun}>
                <div class="slds-var-m-bottom_small" data-id="last-run">
                    <c-barn-status-badge
                        status={lastRunStatus}
                        label={lastRunBadge.badgeLabel}
                        data-id="last-run-badge"
                    ></c-barn-status-badge>
                    <template if:true={hasLastRun}>
                        <p class="slds-var-m-top_xx-small">
                            <span class="slds-text-title_bold">{labels.lastRun}</span>&nbsp;
                            <lightning-formatted-date-time
                                value={lastRunAt}
                                year="numeric"
                                month="short"
                                day="numeric"
                                hour="numeric"
                                minute="2-digit"
                                data-id="last-run-at"
                            ></lightning-formatted-date-time>
                        </p>
                        <p data-id="last-result">{lastRunResult}</p>
                    </template>
                    <template if:false={hasLastRun}>
                        <p class="slds-var-m-top_xx-small" data-id="never-run">{labels.neverRun}</p>
                    </template>
                </div>
            </template>

            <template if:true={fixOutcome}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    variant="success"
                    message={fixOutcome}
                    data-id="fix-outcome"
                ></c-barn-notice>
            </template>

            <template if:true={isReadOnly}>
                <c-barn-notice
                    class="slds-var-m-bottom_small"
                    message={labels.readOnly}
                    data-id="read-only"
                ></c-barn-notice>
            </template>

            <template if:true={hasReport}>
                <section class="slds-var-m-bottom_medium" data-id="org-shape-card">
                    <h3 class="slds-text-heading_small">{labels.orgShapeCard}</h3>
                    <p class="slds-var-m-top_x-small" data-id="org-shape-summary">{orgShapeSummary}</p>
                    <dl class="slds-var-m-top_x-small slds-text-body_small">
                        <dt class="slds-text-title_bold">{labels.currentMode}</dt>
                        <dd data-id="current-mode">{currentModeLabel}</dd>
                        <dt class="slds-text-title_bold slds-var-m-top_xx-small">{labels.recommendedMode}</dt>
                        <dd data-id="recommended-mode">{recommendedModeLabel}</dd>
                    </dl>
                </section>
            </template>

            <template if:true={showNoFindings}>
                <c-barn-empty-state
                    illustration="all-clear"
                    size="compact"
                    heading={labels.noFindings}
                    data-id="no-findings"
                ></c-barn-empty-state>
            </template>

            <template for:each={groups} for:item="group">
                <section key={group.key} class="slds-var-m-bottom_medium" data-id="group">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_x-small">{group.label}</h3>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={group.findings} for:item="finding">
                            <li key={finding.key} class="slds-item" data-id="finding">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon
                                            icon-name={finding.iconName}
                                            variant={finding.iconVariant}
                                            size="x-small"
                                            alternative-text={finding.severityText}
                                            title={finding.severityText}
                                        ></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h4 class="slds-text-title_bold" data-id="finding-title">
                                            {finding.title}
                                        </h4>
                                        <p class="slds-text-body_small" data-id="finding-detail">
                                            {finding.detail}
                                        </p>
                                        <template if:true={finding.hasLinks}>
                                            <ul class="slds-list_dotted slds-text-body_small" data-id="finding-links">
                                                <template for:each={finding.links} for:item="link">
                                                    <li key={link.url}>
                                                        <a href={link.url} data-id="finding-link" onclick={handleFindingLink}>{link.label}</a>
                                                    </li>
                                                </template>
                                            </ul>
                                        </template>
                                        <template if:true={finding.showFix}>
                                            <lightning-button
                                                class="slds-var-m-top_xx-small"
                                                label={finding.fixLabel}
                                                data-target={finding.fixTarget}
                                                data-key={finding.key}
                                                data-id="fix"
                                                onclick={handleFix}
                                            ></lightning-button>
                                        </template>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>
        </div>
    </lightning-card>
    </template>
</template>
