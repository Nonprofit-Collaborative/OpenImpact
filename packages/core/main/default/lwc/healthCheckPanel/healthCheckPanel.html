<template>
    <lightning-card title={labels.title} icon-name="utility:health_check">
        <div slot="actions">
            <lightning-button
                label={labels.rerun}
                onclick={handleRerun}
                class="slds-m-right_x-small"
                data-id="rerun"
            ></lightning-button>
            <template if:true={showUseRecommended}>
                <lightning-button
                    variant="brand"
                    label={labels.useRecommended}
                    onclick={handleUseRecommended}
                    data-id="use-recommended"
                ></lightning-button>
            </template>
        </div>

        <div class="slds-p-horizontal_medium">
            <p class="slds-text-body_small slds-m-bottom_small">{labels.intro}</p>

            <template if:true={loading}>
                <p data-id="loading">{labels.loading}</p>
            </template>

            <template if:true={errorMessage}>
                <p class="slds-text-color_error" data-id="error">{errorMessage}</p>
            </template>

            <template if:true={isReadOnly}>
                <p class="slds-text-body_small slds-m-bottom_small" data-id="read-only">
                    {labels.readOnly}
                </p>
            </template>

            <template if:true={hasReport}>
                <article class="slds-box slds-m-bottom_medium" data-id="org-shape-card">
                    <h2 class="slds-text-heading_small">{labels.orgShapeCard}</h2>
                    <p class="slds-m-top_x-small" data-id="org-shape-summary">{orgShapeSummary}</p>
                    <dl class="slds-m-top_x-small slds-text-body_small">
                        <dt class="slds-text-title">{labels.currentMode}</dt>
                        <dd data-id="current-mode">{currentModeLabel}</dd>
                        <dt class="slds-text-title slds-m-top_xx-small">{labels.recommendedMode}</dt>
                        <dd data-id="recommended-mode">{recommendedModeLabel}</dd>
                    </dl>
                </article>
            </template>

            <template if:true={showNoFindings}>
                <p data-id="no-findings">{labels.noFindings}</p>
            </template>

            <template for:each={groups} for:item="group">
                <section key={group.key} class="slds-m-bottom_medium" data-id="group">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small">{group.label}</h2>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={group.findings} for:item="finding">
                            <li key={finding.key} class="slds-item" data-id="finding">
                                <div class="slds-media">
                                    <div class="slds-media__figure">
                                        <lightning-icon
                                            icon-name={finding.iconName}
                                            variant={finding.iconVariant}
                                            size="x-small"
                                            alternative-text={finding.severityText}
                                            title={finding.severityText}
                                        ></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h3
                                            class="slds-text-heading_x-small"
                                            data-id="finding-title"
                                        >
                                            {finding.title}
                                        </h3>
                                        <p class="slds-text-body_small" data-id="finding-detail">
                                            {finding.detail}
                                        </p>
                                        <template if:true={finding.showFix}>
                                            <lightning-button
                                                class="slds-m-top_xx-small"
                                                label={finding.fixLabel}
                                                data-target={finding.fixTarget}
                                                data-id="fix"
                                                onclick={handleFix}
                                            ></lightning-button>
                                        </template>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </section>
            </template>
        </div>
    </lightning-card>
</template>
