<template>
  <lightning-card title={labels.panelTitle} icon-name="standard:account">
    <lightning-button
      slot="actions"
      label={labels.addButton}
      onclick={handleAdd}
      data-id="add-affiliation"
    ></lightning-button>

    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={errorMessage}>
        <div class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <p class="slds-text-body_regular" data-id="empty">{labels.emptyMessage}</p>
      </template>

      <template for:each={affiliations} for:item="affiliation">
        <div key={affiliation.id} class={affiliation.cardClass} data-id="affiliation-card">
          <div class="slds-grid slds-grid_align-spread">
            <div>
              <p class="slds-text-heading_small" data-id="affiliation-headline">
                {affiliation.headline}
              </p>
              <template lwc:if={affiliation.role}>
                <p class="slds-text-title_caps" data-id="affiliation-role">{affiliation.role}</p>
              </template>
              <template lwc:if={affiliation.description}>
                <p class="slds-text-body_small" data-id="affiliation-description">
                  {affiliation.description}
                </p>
              </template>
            </div>
            <div>
              <template lwc:if={affiliation.isPrimary}>
                <lightning-badge
                  label={labels.primaryBadge}
                  data-id="primary-badge"
                ></lightning-badge>
              </template>
              <template lwc:if={affiliation.isFormer}>
                <lightning-badge
                  label={labels.formerBadge}
                  data-id="former-badge"
                ></lightning-badge>
              </template>
              <template lwc:if={affiliation.showMakePrimary}>
                <lightning-button
                  label={labels.makePrimaryButton}
                  data-id={affiliation.id}
                  onclick={handleMakePrimary}
                  class="make-primary"
                ></lightning-button>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={affiliationObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <lightning-input-field field-name={otherEndFieldName}></lightning-input-field>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
