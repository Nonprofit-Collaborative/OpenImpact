<template>
    <h3 class="slds-text-heading_x-small slds-var-m-top_medium">{labels.heading}</h3>
    <p class="slds-text-body_small slds-var-m-bottom_x-small">{labels.help}</p>
    <template lwc:if={hasRows}>
        <template for:each={rows} for:item="row">
            <div key={row.key} class="slds-grid slds-gutters_x-small slds-wrap" data-id="file-value">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-combobox
                        label={labels.targetLabel}
                        data-key={row.key}
                        data-id="file-value-target"
                        value={row.target}
                        options={options}
                        onchange={handleTargetChange}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                    <lightning-input
                        label={labels.valueLabel}
                        data-key={row.key}
                        data-id="file-value-value"
                        value={row.value}
                        max-length="255"
                        onchange={handleValueChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-align-bottom">
                    <lightning-button
                        class="slds-var-m-top_large"
                        label={labels.removeButton}
                        data-key={row.key}
                        data-id="file-value-remove"
                        onclick={handleRemove}
                    ></lightning-button>
                </div>
            </div>
        </template>
    </template>
    <lightning-button
        class="slds-var-m-top_x-small"
        label={labels.addButton}
        data-id="file-value-add"
        disabled={cannotAdd}
        onclick={handleAdd}
    ></lightning-button>
</template>
