<template>
    <lightning-card title={labels.heading} icon-name="standard:data_integration_hub">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={notice}>
                <p class="slds-text-color_success slds-var-m-bottom_small" data-id="notice">
                    {notice}
                </p>
            </template>
            <template lwc:if={error}>
                <p class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
                    {error}
                </p>
            </template>

            <template lwc:if={confirming}>
                <section class="slds-box slds-var-m-bottom_medium" data-id="confirm">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_small">
                        {confirmTitle}
                    </h3>
                    <template lwc:if={preview}>
                        <div class="slds-grid slds-wrap slds-gutters slds-var-m-bottom_small">
                            <template for:each={previewCounts} for:item="count">
                                <div
                                    key={count.key}
                                    class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-text-align_center"
                                    data-id={count.key}
                                >
                                    <p class="slds-text-heading_medium">{count.value}</p>
                                    <p class="slds-text-body_small">{count.label}</p>
                                </div>
                            </template>
                        </div>
                    </template>
                    <lightning-button
                        label={labels.cancelButton}
                        onclick={handleCancel}
                        data-id="cancel"
                    ></lightning-button>
                    <lightning-button
                        class="slds-var-m-left_x-small"
                        variant="destructive"
                        label={labels.confirmButton}
                        disabled={cannotConfirm}
                        onclick={handleConfirm}
                        data-id="confirm-button"
                    ></lightning-button>
                </section>
            </template>

            <template lwc:if={loading}>
                <lightning-spinner
                    alternative-text={labels.loadingAltText}
                    size="small"
                ></lightning-spinner>
            </template>
            <template lwc:elseif={hasBatches}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={rows} for:item="batch">
                        <li key={batch.id} class="slds-item" data-id="batch">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col">
                                    <p class="slds-text-title_bold">{batch.name}</p>
                                    <p class="slds-text-body_small">
                                        {batch.fileName} · {batch.status}
                                    </p>
                                    <template lwc:if={batch.showDeadline}>
                                        <p class="slds-text-body_small">
                                            {labels.undoUntil}
                                            <lightning-formatted-date-time
                                                class="slds-var-m-left_xx-small"
                                                value={batch.undoDeadline}
                                                year="numeric"
                                                month="short"
                                                day="numeric"
                                            ></lightning-formatted-date-time>
                                        </p>
                                    </template>
                                </div>
                                <template lwc:if={batch.canUndo}>
                                    <lightning-button
                                        label={labels.undoButton}
                                        data-id={batch.id}
                                        disabled={working}
                                        onclick={handleUndo}
                                    ></lightning-button>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="slds-text-body_small" data-id="empty">{labels.empty}</p>
            </template>
        </div>
    </lightning-card>
</template>
