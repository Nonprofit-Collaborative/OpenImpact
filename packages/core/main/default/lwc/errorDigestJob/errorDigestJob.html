<template>
    <div class="slds-var-p-around_medium">
        <h2 class="slds-text-heading_small" data-id="title">{labels.title}</h2>
        <p class="slds-text-body_small slds-var-m-bottom_small" data-id="intro">
            {labels.intro}
        </p>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-bottom_small" data-id="error" role="alert">
                {errorMessage}
            </p>
        </template>

        <div class="slds-box slds-box_x-small slds-var-m-bottom_small">
            <p data-id="schedule-message">
                {scheduleMessage}
                <template lwc:if={nextRunAt}>
                    <lightning-formatted-date-time
                        class="slds-var-m-left_xx-small"
                        data-id="next-run"
                        value={nextRunAt}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </template>
            </p>

            <p>
                <strong>{labels.lastRunTitle}:</strong>
                <template lwc:if={lastRun}>
                    <lightning-formatted-date-time
                        class="slds-var-m-left_xx-small"
                        data-id="last-run"
                        value={lastRun}
                        year="numeric"
                        month="short"
                        day="2-digit"
                        hour="2-digit"
                        minute="2-digit"
                    ></lightning-formatted-date-time>
                </template>
                <template lwc:else>
                    <span data-id="never-run"> {labels.neverRun}</span>
                </template>
            </p>
            <template lwc:if={lastRunSummary}>
                <p
                    class="slds-text-body_small"
                    data-id="last-run-summary"
                    role="status"
                    aria-live="polite"
                >
                    {lastRunSummary}
                </p>
            </template>

            <p class="slds-var-m-top_x-small" data-id="recipients">
                <strong>{labels.recipientsTitle}:</strong> {recipientsText}
            </p>

            <div class="slds-var-m-top_x-small">
                <lightning-button
                    data-id="schedule-button"
                    label={scheduleButtonLabel}
                    disabled={controlsDisabled}
                    onclick={handleSchedule}
                ></lightning-button>
                <lightning-button
                    class="slds-var-m-left_x-small"
                    data-id="send-now"
                    label={labels.sendNow}
                    disabled={controlsDisabled}
                    onclick={handleSendNow}
                ></lightning-button>
            </div>

            <template lwc:if={showReadOnlyNote}>
                <p class="slds-text-body_small slds-var-m-top_x-small" data-id="read-only">
                    {labels.readOnly}
                </p>
            </template>
        </div>
    </div>
</template>
