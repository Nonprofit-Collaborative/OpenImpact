<template>
    <ul class="slds-has-dividers_bottom-space">
        <template for:each={rows} for:item="module">
            <li key={module.name} class="slds-item slds-var-p-vertical_xx-small">
                <span class={module.statusClass}>{module.status}</span>
                <span class="slds-text-heading_x-small slds-var-m-left_x-small">{module.name}</span>
                <a class="slds-var-m-left_small" href={module.docsUrl} target="_blank"
                    >{labels.learnMore}
                    <span class="slds-assistive-text">{module.name}</span>
                </a>
            </li>
        </template>
    </ul>

    <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
        {labels.managerNotice}
    </p>
</template>
