<template>
    <div class="slds-grid slds-wrap slds-gutters_x-small">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
                label={labels.legalName}
                data-key="Organization_Legal_Name__c"
                value={draft.Organization_Legal_Name__c}
                disabled={isReadOnly}
                max-length="255"
                onchange={handleFieldChange}
            ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
                label={labels.ein}
                data-key="Organization_EIN__c"
                value={draft.Organization_EIN__c}
                disabled={isReadOnly}
                max-length="20"
                onchange={handleFieldChange}
            ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1">
            <lightning-input
                label={labels.address}
                data-key="Organization_Address__c"
                value={draft.Organization_Address__c}
                disabled={isReadOnly}
                max-length="255"
                onchange={handleFieldChange}
            ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
                label={labels.signerName}
                data-key="Receipt_Signer_Name__c"
                value={draft.Receipt_Signer_Name__c}
                disabled={isReadOnly}
                max-length="80"
                onchange={handleFieldChange}
            ></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-input
                label={labels.signerTitle}
                data-key="Receipt_Signer_Title__c"
                value={draft.Receipt_Signer_Title__c}
                disabled={isReadOnly}
                max-length="80"
                onchange={handleFieldChange}
            ></lightning-input>
        </div>
    </div>

    <template lwc:if={canEdit}>
        <div class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-top_small">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-file-upload
                    label={labels.logo}
                    name="logo"
                    accept={acceptedFormats}
                    record-id={userId}
                    onuploadfinished={handleLogoUploaded}
                ></lightning-file-upload>
                <p class="slds-text-body_small slds-text-color_weak" data-id="logo-id">
                    {logoDocumentId}
                </p>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-file-upload
                    label={labels.signature}
                    name="signature"
                    accept={acceptedFormats}
                    record-id={userId}
                    onuploadfinished={handleSignatureUploaded}
                ></lightning-file-upload>
                <p class="slds-text-body_small slds-text-color_weak" data-id="signature-id">
                    {signatureDocumentId}
                </p>
            </div>
        </div>

        <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">
            {labels.uploadHelp}
        </p>

        <lightning-button
            class="slds-var-m-top_small"
            variant="brand"
            label={labels.save}
            onclick={handleSave}
        ></lightning-button>
    </template>
</template>
