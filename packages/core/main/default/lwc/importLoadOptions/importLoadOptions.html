<template>
    <lightning-combobox
        data-id="operation"
        label={labels.operationLabel}
        value={operation}
        options={operationOptions}
        onchange={handleOperationChange}
    ></lightning-combobox>
    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="operation-help">
        {operationHelp}
    </p>
    <template lwc:if={isUpsert}>
        <lightning-combobox
            data-id="match-field"
            label={labels.matchFieldLabel}
            value={matchField}
            options={keyFieldOptions}
            required
            onchange={handleMatchFieldChange}
        ></lightning-combobox>
    </template>
    <lightning-radio-group
        class="slds-var-m-top_small"
        data-id="not-found"
        name="lookup-not-found"
        label={labels.notFoundLabel}
        value={lookupNotFound}
        options={notFoundOptions}
        onchange={handleNotFoundChange}
    ></lightning-radio-group>
    <p class="slds-text-body_small slds-var-m-top_x-small" data-id="not-found-help">
        {notFoundHelp}
    </p>
</template>
