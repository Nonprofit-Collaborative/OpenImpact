<template>
  <lightning-card title={labels.panelTitle} icon-name="standard:address">
    <lightning-button
      slot="actions"
      label={labels.addButton}
      onclick={handleAdd}
      data-id="add-address"
    ></lightning-button>

    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={errorMessage}>
        <div class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <p class="slds-text-body_regular" data-id="empty">{labels.emptyMessage}</p>
      </template>

      <template for:each={addresses} for:item="address">
        <div key={address.id} class={address.cardClass} data-id="address-card">
          <div class="slds-grid slds-grid_align-spread">
            <div>
              <p class="slds-text-title_caps" data-id="address-type">{address.addressType}</p>
              <p data-id="address-street">{address.street}</p>
              <p data-id="address-city">{address.cityLine}</p>
              <p data-id="address-country">{address.country}</p>
              <template lwc:if={address.seasonalText}>
                <p class="slds-text-body_small" data-id="address-seasonal">
                  {address.seasonalText}
                </p>
              </template>
            </div>
            <div>
              <template lwc:if={address.isDefault}>
                <lightning-badge label={labels.defaultBadge} data-id="default-badge"></lightning-badge>
              </template>
              <template lwc:if={address.showSetDefault}>
                <lightning-button
                  label={labels.setDefaultButton}
                  data-id={address.id}
                  onclick={handleSetDefault}
                  class="set-default"
                ></lightning-button>
              </template>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={addressObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={ownerFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
