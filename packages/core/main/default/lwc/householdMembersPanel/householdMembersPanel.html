<template>
    <lightning-card title={label.title} icon-name="standard:people">
        <div class="slds-var-m-around_medium">
            <template if:false={isHousehold}>
                <p class="slds-text-color_weak not-a-household">{label.notAHousehold}</p>
            </template>

            <template if:true={isHousehold}>
                <template if:false={hasMembers}>
                    <p class="slds-text-color_weak empty-message">{label.empty}</p>
                </template>

                <ul class="slds-has-dividers_bottom-space member-list">
                    <template for:each={members} for:item="member">
                        <li key={member.personId} class="slds-item member-row">
                            <span class="slds-text-body_regular member-name">{member.name}</span>
                            <template if:true={member.role}>
                                <span class="slds-text-body_small slds-var-m-left_x-small member-role">
                                    {member.role}
                                </span>
                            </template>
                            <template for:each={member.badges} for:item="badge">
                                <lightning-badge key={badge.key} label={badge.text}></lightning-badge>
                            </template>
                            <lightning-button
                                variant="base"
                                label={label.moveMember}
                                data-person-id={member.personId}
                                onclick={handleMoveClick}
                                class="slds-var-m-left_x-small move-button"
                            ></lightning-button>
                        </li>
                    </template>
                </ul>

                <template if:true={isMoving}>
                    <div class="slds-box slds-var-m-top_small move-box">
                        <p class="slds-var-m-bottom_x-small">{label.moveHelp}</p>
                        <lightning-record-edit-form object-api-name="Contact">
                            <lightning-input-field
                                field-name="AccountId"
                                variant="label-hidden"
                                onchange={handleTargetChange}
                            ></lightning-input-field>
                        </lightning-record-edit-form>
                        <div class="slds-var-m-top_x-small">
                            <lightning-button
                                variant="brand"
                                label={label.save}
                                onclick={handleMoveSave}
                                class="slds-var-m-right_x-small move-save-button"
                            ></lightning-button>
                            <lightning-button
                                label={label.cancel}
                                onclick={handleMoveCancel}
                                class="move-cancel-button"
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={canAddMember}>
                    <div class="slds-var-m-top_small">
                        <lightning-button
                            label={label.addMember}
                            onclick={handleAddClick}
                            class="add-button"
                        ></lightning-button>
                    </div>
                </template>

                <template if:true={isJunctionMode}>
                    <p class="slds-text-body_small slds-var-m-top_small junction-message">
                        {label.addMemberJunction}
                    </p>
                </template>

                <template if:true={isAdding}>
                    <div class="slds-box slds-var-m-top_small add-box">
                        <lightning-record-edit-form object-api-name="Contact" onsuccess={handleAddSuccess}>
                            <lightning-messages></lightning-messages>
                            <lightning-input-field field-name="Salutation"></lightning-input-field>
                            <lightning-input-field field-name="FirstName"></lightning-input-field>
                            <lightning-input-field field-name="LastName"></lightning-input-field>
                            <div class="slds-hide">
                                <lightning-input-field field-name="AccountId" value={recordId}></lightning-input-field>
                            </div>
                            <div class="slds-var-m-top_x-small">
                                <lightning-button
                                    variant="brand"
                                    type="submit"
                                    label={label.save}
                                    class="slds-var-m-right_x-small add-save-button"
                                ></lightning-button>
                                <lightning-button
                                    label={label.cancel}
                                    onclick={handleAddCancel}
                                    class="add-cancel-button"
                                ></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </template>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-var-m-top_small" role="alert">{errorMessage}</div>
            </template>
        </div>
    </lightning-card>
</template>
