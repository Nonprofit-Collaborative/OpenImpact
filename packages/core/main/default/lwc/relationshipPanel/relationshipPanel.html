<template>
  <lightning-card title={labels.panelTitle} icon-name="standard:people">
    <lightning-button
      slot="actions"
      label={labels.addButton}
      onclick={handleAdd}
      data-id="add-relationship"
    ></lightning-button>

    <div class="slds-var-p-horizontal_medium">
      <template lwc:if={errorMessage}>
        <div class="slds-text-color_error slds-var-m-bottom_small" data-id="error">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isEmpty}>
        <p class="slds-text-body_regular" data-id="empty">{labels.emptyMessage}</p>
      </template>

      <template for:each={relationships} for:item="relationship">
        <div key={relationship.id} class={relationship.cardClass} data-id="relationship-card">
          <div class="slds-grid slds-grid_align-spread">
            <div>
              <p class="slds-text-heading_small" data-id="related-person">
                {relationship.relatedPersonName}
              </p>
              <p class="slds-text-title_caps" data-id="relationship-type">
                {relationship.relationshipType}
              </p>
              <template lwc:if={relationship.description}>
                <p class="slds-text-body_small" data-id="relationship-description">
                  {relationship.description}
                </p>
              </template>
            </div>
            <div>
              <template lwc:if={relationship.isFormer}>
                <lightning-badge
                  label={labels.formerBadge}
                  data-id="former-badge"
                ></lightning-badge>
              </template>
              <lightning-button
                label={labels.removeButton}
                data-id={relationship.id}
                onclick={handleRemove}
                class="remove-relationship"
              ></lightning-button>
            </div>
          </div>
        </div>
      </template>

      <template lwc:if={showForm}>
        <div class="slds-box slds-var-m-top_small" data-id="add-form">
          <h3 class="slds-text-heading_small slds-var-m-bottom_small">{labels.addFormTitle}</h3>
          <lightning-record-edit-form
            object-api-name={relationshipObject}
            onsuccess={handleFormSuccess}
            onerror={handleFormError}
          >
            <lightning-messages></lightning-messages>
            <lightning-input-field
              field-name={personFieldName}
              value={recordId}
              variant="label-hidden"
            ></lightning-input-field>
            <lightning-input-field field-name={relatedPersonFieldName}></lightning-input-field>
            <template for:each={formFields} for:item="fieldName">
              <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
            </template>
            <div class="slds-var-m-top_small">
              <lightning-button
                variant="neutral"
                label={labels.cancelButton}
                onclick={handleCancel}
                data-id="cancel"
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                variant="brand"
                type="submit"
                label={labels.addButton}
                data-id="save"
              ></lightning-button>
            </div>
          </lightning-record-edit-form>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
