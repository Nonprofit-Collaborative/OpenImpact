<template>
    <div class="slds-var-p-around_medium">
        <h1 class="slds-text-heading_medium">{labels.welcomeHeading}</h1>
        <p class="slds-text-body_regular slds-var-m-bottom_medium">{labels.welcomeMessage}</p>

        <template lwc:if={automationPaused}>
            <div class="slds-box slds-theme_warning slds-var-m-bottom_medium" role="status">
                {labels.pausedBanner}
            </div>
        </template>

        <template lwc:if={errorMessage}>
            <p class="slds-text-color_error slds-var-m-bottom_small" role="alert">
                {errorMessage}
            </p>
        </template>

        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                <lightning-card title={labels.checklistHeading}>
                    <div class="slds-var-p-horizontal_medium">
                        <c-setup-assistant
                            steps={steps}
                            completed={stepsCompleted}
                            total={stepsTotal}
                            can-edit={canEdit}
                            onstepdone={handleStepDone}
                            onstepnotdone={handleStepNotDone}
                        ></c-setup-assistant>
                    </div>
                </lightning-card>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                <lightning-card title={labels.errorTileHeading}>
                    <div class="slds-var-p-horizontal_medium">
                        <p class="slds-text-heading_large" data-id="error-count">
                            {newErrorCount}
                        </p>
                        <a href={errorLogUrl}>{labels.errorTileLink}</a>
                    </div>
                </lightning-card>

                <lightning-card title={labels.quickLinksHeading} class="slds-var-m-top_medium">
                    <div class="slds-var-p-horizontal_medium">
                        <ul class="slds-list_vertical slds-has-dividers_bottom-space">
                            <template for:each={quickLinks} for:item="link">
                                <li key={link.key} class="slds-item">
                                    <a href={link.url}>{link.label}</a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
