<template>
    <lightning-card title={labels.cardTitle} icon-name="standard:dataset">
        <span slot="actions">
            <span class={statusBadgeClass}>{statusLabel}</span>
        </span>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="slds-box slds-theme_warning slds-m-bottom_small" role="alert">
                <p>{labels.productionWarning}</p>
            </div>

            <template if:true={isLoadingStatus}>
                <lightning-spinner
                    alternative-text={labels.loadingAltText}
                    size="small"
                ></lightning-spinner>
            </template>

            <template if:false={isLoadingStatus}>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-text-align_center">
                        <p class="slds-text-heading_medium">{householdCount}</p>
                        <p class="slds-text-body_small">{labels.householdsLabel}</p>
                    </div>
                    <div class="slds-col slds-text-align_center">
                        <p class="slds-text-heading_medium">{contactCount}</p>
                        <p class="slds-text-body_small">{labels.contactsLabel}</p>
                    </div>
                    <div class="slds-col slds-text-align_center">
                        <p class="slds-text-heading_medium">{organizationCount}</p>
                        <p class="slds-text-body_small">{labels.organizationsLabel}</p>
                    </div>
                </div>

                <template if:false={canManage}>
                    <p class="slds-text-color_weak">{labels.readOnlyMessage}</p>
                </template>

                <template if:true={canManage}>
                    <template if:false={showConfirm}>
                        <lightning-button
                            variant="brand"
                            label={labels.loadButtonLabel}
                            onclick={handleLoadClick}
                            disabled={loadDisabled}
                            class="slds-m-right_small"
                        ></lightning-button>
                        <lightning-button
                            variant="destructive"
                            label={labels.removeButtonLabel}
                            onclick={handleRemoveClick}
                            disabled={removeDisabled}
                        ></lightning-button>
                    </template>

                    <template if:true={showConfirm}>
                        <div class="slds-box slds-m-top_small">
                            <p class="slds-text-heading_small slds-m-bottom_x-small">{confirmTitle}</p>
                            <p class="slds-m-bottom_small">{confirmBody}</p>
                            <lightning-button
                                variant="neutral"
                                label={labels.cancelButtonLabel}
                                onclick={handleCancel}
                                disabled={isBusy}
                                class="slds-m-right_small"
                            ></lightning-button>
                            <lightning-button
                                variant="brand"
                                label={labels.confirmButtonLabel}
                                onclick={handleConfirm}
                                disabled={isBusy}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
