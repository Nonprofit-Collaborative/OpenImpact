<template>
    <lightning-card title={labels.title} icon-name="standard:file">
        <div class="slds-var-p-horizontal_medium">
            <p class="slds-var-m-bottom_small" data-id="intro">{labels.intro}</p>
            <p class="slds-text-color_weak slds-var-m-bottom_medium" data-id="visibility">
                {labels.visibility}
            </p>
            <div class="slds-grid slds-wrap slds-gutters_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="date"
                        label={labels.from}
                        value={fromDate}
                        required
                        onchange={handleFromChange}
                        data-id="from"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-input
                        type="date"
                        label={labels.to}
                        value={toDate}
                        required
                        onchange={handleToChange}
                        data-id="to"
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-record-picker
                        label={labels.fund}
                        placeholder={labels.allFunds}
                        object-api-name={fundObjectApiName}
                        value={fundId}
                        onchange={handleFundChange}
                        data-id="fund"
                    ></lightning-record-picker>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label={labels.paymentMethod}
                        options={methodOptions}
                        value={paymentMethod}
                        onchange={handleMethodChange}
                        data-id="method"
                    ></lightning-combobox>
                </div>
            </div>
            <div class="slds-var-m-vertical_medium">
                <lightning-button
                    variant="brand"
                    label={labels.download}
                    onclick={handleDownload}
                    disabled={working}
                    data-id="download"
                ></lightning-button>
            </div>
            <template lwc:if={error}>
                <p class="slds-text-color_error slds-var-m-bottom_medium" role="alert" data-id="error">
                    {error}
                </p>
            </template>
            <template lwc:if={message}>
                <p class="slds-var-m-bottom_medium" role="status" data-id="message">{message}</p>
            </template>
        </div>
    </lightning-card>
</template>
