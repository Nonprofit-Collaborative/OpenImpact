<template>
    <lightning-card title={labels.title} icon-name="standard:opportunity">
        <div class="slds-var-p-horizontal_medium slds-is-relative">
            <template lwc:if={spinnerShown}>
                <lightning-spinner alternative-text={labels.loading} size="small" data-id="spinner"></lightning-spinner>
            </template>
            <p class="slds-var-m-bottom_medium" data-id="intro">{labels.intro}</p>
            <template lwc:if={unavailableShown}>
                <p class="slds-var-m-bottom_medium" role="status" data-id="unavailable">
                    {labels.unavailable}
                </p>
            </template>
            <template lwc:if={offShown}>
                <p class="slds-var-m-bottom_medium" role="status" data-id="off">
                    {labels.switchedOff}
                </p>
            </template>
            <template lwc:if={onShown}>
                <p class="slds-var-m-bottom_small" role="status" data-id="direction">
                    {directionText}
                </p>
                <p class="slds-var-m-bottom_small" data-id="schedule">{scheduleText}</p>
                <p class="slds-var-m-bottom_small" data-id="last-run">{lastRunText}</p>
                <template lwc:if={noManageShown}>
                    <p class="slds-text-color_weak slds-var-m-bottom_small" data-id="no-manage">
                        {labels.noManagePermission}
                    </p>
                </template>
                <template lwc:if={noAccessShown}>
                    <p class="slds-text-color_error slds-var-m-bottom_small" data-id="no-access">
                        {labels.noOpportunityAccess}
                    </p>
                </template>
                <div class="slds-var-m-vertical_medium">
                    <lightning-button
                        variant="brand"
                        label={labels.runNow}
                        onclick={handleRunNow}
                        disabled={runDisabled}
                        data-id="run-now"
                    ></lightning-button>
                    <template lwc:if={scheduled}>
                        <lightning-button
                            class="slds-var-m-left_small"
                            label={labels.stopSchedule}
                            onclick={handleStop}
                            disabled={manageDisabled}
                            data-id="stop"
                        ></lightning-button>
                    </template>
                    <template lwc:else>
                        <lightning-button
                            class="slds-var-m-left_small"
                            label={labels.scheduleNightly}
                            onclick={handleSchedule}
                            disabled={scheduleDisabled}
                            data-id="schedule-nightly"
                        ></lightning-button>
                    </template>
                </div>
                <template lwc:if={runningShown}>
                    <p class="slds-var-m-bottom_medium" role="status" data-id="running">
                        {runningText}
                    </p>
                </template>
            </template>
            <template lwc:if={error}>
                <p class="slds-text-color_error slds-var-m-bottom_medium" role="alert" data-id="error">
                    {error}
                </p>
            </template>
            <template lwc:if={available}>
                <h2 class="slds-text-heading_small slds-var-m-top_large slds-var-m-bottom_x-small">
                    {labels.reconciliationTitle}
                </h2>
                <p class="slds-var-m-bottom_small">{labels.reconciliationIntro}</p>
                <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label={labels.fromDate}
                            value={fromDate}
                            onchange={handleFrom}
                            data-id="from"
                        ></lightning-input>
                    </div>
                    <div class="slds-col">
                        <lightning-input
                            type="date"
                            label={labels.toDate}
                            value={toDate}
                            onchange={handleTo}
                            data-id="to"
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-var-m-top_small">
                        <lightning-button
                            label={labels.compare}
                            onclick={handleCompare}
                            disabled={working}
                            data-id="compare"
                        ></lightning-button>
                    </div>
                </div>
                <template lwc:if={comparison}>
                    <p class="slds-var-m-top_medium" data-id="gift-side">{giftSideText}</p>
                    <p data-id="opportunity-side">{opportunitySideText}</p>
                    <p class="slds-var-m-vertical_small" role="status" data-id="difference-count">
                        {differenceText}
                    </p>
                    <template lwc:if={copyAgainShown}>
                        <lightning-button
                            class="slds-var-m-bottom_small"
                            label={labels.copyAgain}
                            onclick={handleCopyAgain}
                            disabled={runDisabled}
                            data-id="copy-again"
                        ></lightning-button>
                    </template>
                    <template lwc:if={hasDifferences}>
                        <div class="slds-scrollable_x">
                            <lightning-datatable
                                key-field="key"
                                data={rows}
                                columns={columns}
                                hide-checkbox-column
                                data-id="differences"
                            ></lightning-datatable>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
