name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run prettier:verify

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:unit:coverage

      - name: Check namespace
        run: bash scripts/ci/check-namespace.sh

      - name: Check standard object references
        run: bash scripts/ci/check-standard-objects.sh

      - name: Check every object named in packages is on the allowlist
        run: python3 scripts/ci/check-object-allowlist.py

      - name: Check custom metadata records against their types
        run: python3 scripts/ci/check-custom-metadata.py

      - name: Check custom labels against the platform limits
        run: python3 scripts/ci/check-labels.py

      - name: Check no tracked symlink leaves the repository
        run: bash scripts/ci/check-symlinks.sh

      - name: Check permission sets grant only what exists
        run: python3 scripts/ci/check-permission-sets.py

      - name: Check every Learn more link points at a page that exists
        run: python3 scripts/ci/check-help-links.py

      - name: Check the decision records are numbered and indexed consistently
        run: python3 scripts/ci/check-adrs.py

      - name: Check every exposed component is reachable from something
        run: python3 scripts/ci/check-components-reachable.py

      - name: Check every packaged record page is actually assigned
        run: python3 scripts/ci/check-record-pages-assigned.py

      - name: Check the canonical model lists every shipped API name
        run: python3 scripts/ci/check-canonical-model.py

      - name: Check every setting that ships switched on actually reads on
        run: python3 scripts/ci/check-setting-defaults.py

      - name: Fail on em dash characters
        run: |
          set +e
          git grep -n -I $'\xe2\x80\x94' -- . ':!package-lock.json'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Em dash characters found in tracked files. See lines above."
            exit 1
          elif [ "$status" -eq 1 ]; then
            echo "No em dash characters found."
          else
            echo "git grep failed unexpectedly."
            exit "$status"
          fi

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer plugin
        run: echo y | sf plugins install code-analyzer

      - name: Cache apex-ls (offline Apex checker)
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            .tools/apex-ls
          key: apex-ls-${{ hashFiles('scripts/ci/check-apex-offline.sh') }}

      - name: Offline Apex compile check
        run: bash scripts/ci/check-apex-offline.sh

      - name: Run Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace packages \
            --rule-selector Recommended \
            --severity-threshold 2 \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.json

      - name: Upload Code Analyzer results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-analyzer-results
          path: |
            code-analyzer-results.html
            code-analyzer-results.json
          if-no-files-found: ignore

  org-tests:
    name: Org tests
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Manual dispatch only. Org tests run from a contributor's machine now, through
    # scripts/org/run-org-tests.sh, which posts the "Org tests (local)" status the main
    # ruleset requires. Running this on every push to main as well cost CI minutes for a
    # second run of a suite that already passed on the same commit before it could merge.
    # Keep it for a deliberate check against the secret's org.
    if: github.event_name == 'workflow_dispatch'
    # One org means one deploy at a time, so the group is global rather than per ref.
    # cancel-in-progress is false on purpose: killing a deploy partway through would leave
    # the org holding half a package, and a persistent org keeps that state. Runs queue
    # instead, and GitHub keeps only the newest waiting run, which is the one worth having.
    concurrency:
      group: org-tests-persistent
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Check for the test org secret
        id: check
        env:
          SF_TEST_ORG_AUTH_URL: ${{ secrets.SF_TEST_ORG_AUTH_URL }}
        run: |
          if [ -n "$SF_TEST_ORG_AUTH_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate the test org
        if: steps.check.outputs.enabled == 'true'
        env:
          SF_TEST_ORG_AUTH_URL: ${{ secrets.SF_TEST_ORG_AUTH_URL }}
        run: |
          AUTH_FILE=$(mktemp)
          echo "$SF_TEST_ORG_AUTH_URL" > "$AUTH_FILE"
          sf org login sfdx-url --sfdx-url-file "$AUTH_FILE" --alias testorg
          rm -f "$AUTH_FILE"

      - name: Report how long the org has left
        if: steps.check.outputs.enabled == 'true'
        run: bash scripts/org/check-org-expiry.sh testorg

      - name: Report which shape the org actually is
        if: steps.check.outputs.enabled == 'true'
        run: bash scripts/org/report-org-shape.sh testorg

      - name: Deploy the packages, in stages
        if: steps.check.outputs.enabled == 'true'
        run: bash scripts/org/deploy-packages.sh testorg

      # A real install gives the installing administrator the admin roles, and the tests run
      # as that user in user mode. Deploying metadata grants no field access by itself, so
      # without this every test that writes a packaged field fails as "inaccessible". An
      # assignment that already exists is reported and ignored; any other failure shows here.
      - name: Give the test user the packaged admin roles
        if: steps.check.outputs.enabled == 'true'
        run: |
          for ps in Nonprofit_Admin Giving_Admin; do
            sf org assign permset --name "$ps" --target-org testorg --json > assign.json || true
            if jq -e '.result.failures[]? | select(.message | test("Duplicate") | not)' assign.json > /dev/null; then
              cat assign.json
              exit 1
            fi
            echo "$ps assigned (or already assigned)"
          done

      - name: Run Apex tests
        if: steps.check.outputs.enabled == 'true'
        run: |
          sf apex run test \
            --target-org testorg \
            --test-level RunLocalTests \
            --code-coverage \
            --result-format human \
            --output-dir test-results \
            --wait 30

      - name: Upload test results
        if: always() && steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: Say why this was skipped
        if: steps.check.outputs.enabled != 'true'
        run: echo "::warning::SF_TEST_ORG_AUTH_URL is not set, so no Apex test ran. Create a 30 day org with scripts/org/create-scratch-org.sh and store its auth URL. See docs/contributor-guide/ci.md."

  # The main ruleset requires the "Org tests (local)" status on every pull request, and
  # scripts/org/run-org-tests.sh is what posts it. A pull request that changes nothing an org
  # deploy would pick up (documentation, the workflow itself, a Dependabot bump of an action)
  # has nothing an org run could catch, so this posts the status for it instead. A pull
  # request that does change deployable source gets nothing from here, and stays blocked until
  # someone runs the org tests on its head commit.
  org-tests-not-needed:
    name: Org tests not needed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Post the org test status when no deployable source changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            packages scripts/org config sfdx-project.json)
          if [ -n "$changed" ]; then
            echo "Deployable source changed, so this needs a real org run:"
            echo "$changed"
            echo "Run scripts/org/run-org-tests.sh <alias> on the head commit."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" --silent \
            -f state=success \
            -f context="Org tests (local)" \
            -f description="No deployable source changed, so no org run is needed"
          echo "No deployable source changed. Posted the org test status."

  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailer on PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Merge commits carry no authored content, so nobody certifies their origin: the
          # certification belongs on the commits a merge brings in, every one of which this
          # loop still checks. The Developer Certificate of Origin's own tooling skips them
          # for the same reason.
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Commit $sha is missing a Signed-off-by trailer:"
              git show -s --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Fix with 'git commit --amend -s' for the last commit, or 'git rebase --signoff <base>' to sign off a whole branch, then force-push."
            exit 1
          fi

      - name: Check Signed-off-by trailer on pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$zero_sha" ]; then
            echo "New branch push detected (before sha is zero); skipping DCO range check."
            exit 0
          fi
          missing=0
          # Merge commits are exempt here for the same reason as above.
          for sha in $(git rev-list --no-merges "$BEFORE_SHA..$AFTER_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Commit $sha is missing a Signed-off-by trailer:"
              git show -s --format='  %h %s' "$sha"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Fix with 'git commit --amend -s' for the last commit, or 'git rebase --signoff <base>' to sign off a whole branch, then force-push."
            exit 1
          fi
