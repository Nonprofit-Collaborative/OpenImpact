name: Bug report
description: Report something that is not working as expected in Open Impact.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so someone else can reproduce this from a fresh org.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: org-shape
    attributes:
      label: Org shape
      description: Which org shape were you using when this happened?
      options:
        - Platform only
        - Sales or Service Cloud
        - NPSP installed
        - Agentforce Nonprofit or Person Accounts
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Open Impact version
      description: The package version(s) installed, for example Core 0.1.3.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which package does this affect?
      options:
        - Core
        - Giving
        - Volunteers
        - Programs
        - Funders
        - Connect
        - Not sure
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: Error Log message
      description: If the Error Log captured a message, paste it here verbatim.
    validations:
      required: false
