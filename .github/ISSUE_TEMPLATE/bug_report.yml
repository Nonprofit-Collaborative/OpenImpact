name: Bug report
description: Report something that is not working as expected in BarnCRM.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal or donor data: this issue is public. Use made-up values and blur names, emails, addresses and amounts in screenshots. For a security problem, do not post here; see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps so someone else can reproduce this from a fresh org.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: dropdown
    id: org-shape
    attributes:
      label: Org shape
      description: Which org shape were you using when this happened?
      options:
        - Platform only
        - Sales or Service Cloud
        - NPSP installed
        - Nonprofit Cloud or Person Accounts
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BarnCRM version or commit
      description: The package version(s) installed, or the short commit of main you deployed (git rev-parse --short HEAD).
    validations:
      required: true

  - type: input
    id: edition
    attributes:
      label: Salesforce edition
      description: For example Developer, Enterprise, Nonprofit Power of Us.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which package does this affect?
      options:
        - Core
        - Rollup Builder
        - Giving
        - Volunteers
        - Programs
        - Grants
        - Event Management
        - Mirror
        - Mirror for Giving
        - Not sure
    validations:
      required: true

  - type: textarea
    id: error-log
    attributes:
      label: Error Log message
      description: If the Error Log captured a message, paste it here verbatim.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Remove or blur personal and donor data first.
    validations:
      required: false
